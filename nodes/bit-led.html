<script type="text/javascript">
(function () {
    RED.nodes.registerType('ui-bit-led', {
        category: 'dashboard', color: '#4db6ac', icon: 'font-awesome/fa-circle',
        inputs: 1, outputs: 0, paletteLabel: 'bit LEDs',
        label: function () { return this.name || 'bit LEDs' },
        defaults: {
            name: { value: '' }, group: { type: 'ui-group', required: true },
            order: { value: 0 }, width: { value: 0 }, height: { value: 0 },
            inputType: { value: 'uint8', required: true }, count: { value: 8, required: true },
            layout: { value: 'grid' }, columns: { value: 4, validate: RED.validators.number() },
            labelLayout: { value: 'led-label' },
            inverted: { value: false }, activeColor: { value: '' }, passiveColor: { value: '' },
            disabledColor: { value: '' }, diagnostics: { value: false },
            indicators: { value: [] }
        },
        oneditprepare: function () {
            const node = this
            let previousInputType = node.inputType || 'uint8'
            $('#node-input-labelLayout').val(node.labelLayout || 'led-label')
            $('input[name="bit-led-label-layout"]').val([node.labelLayout || 'led-label']).on('change', function () {
                $('#node-input-labelLayout').val(this.value)
            })
            let rows = (node.indicators || []).map(function (row) { return Object.assign({}, row) })
            function readRows () {
                $('#bit-led-indicators .bit-led-editor-row').each(function (i) {
                    const row = $(this)
                    const inverted = row.find('.led-inverted').val()
                    rows[i] = {
                        source: $('#node-input-inputType').val() === 'object' ? row.find('.led-source').val() : Number(row.find('.led-source').val()),
                        label: row.find('.led-label').val(), enabled: row.find('.led-enabled').prop('checked'),
                        hidden: row.find('.led-hidden').prop('checked'),
                        inverted: inverted === 'inherit' ? null : inverted === 'true',
                        activeColor: row.find('.led-activeColor').val(), passiveColor: row.find('.led-passiveColor').val(),
                        icon: row.find('.led-icon').val()
                    }
                })
            }
            function renderRows () {
                const type = $('#node-input-inputType').val()
                const count = Number($('#node-input-count').val())
                const container = $('#bit-led-indicators').empty()
                for (let i = 0; i < count; i++) {
                    const item = rows[i] || {}
                    const row = $('<fieldset class="bit-led-editor-row">').appendTo(container)
                    $('<legend>').text('LED ' + (i + 1)).appendTo(row)
                    function field (key, title, value) {
                        const label = $('<label>').text(title).appendTo(row)
                        return $('<input type="text">').addClass('led-' + key).val(value).appendTo(label)
                    }
                    const source = item.source === undefined ? (type === 'object' ? 'bit' + i : i) : item.source
                    field('source', type === 'object' ? 'Input key (literal)' : 'Bit / index (zero-based)', source)
                    field('label', 'Label', item.label === undefined ? 'Bit ' + i : item.label)
                    const logicLabel = $('<label>').text('Logic').appendTo(row)
                    $('<select class="led-inverted"><option value="inherit">Use default</option><option value="false">Normal</option><option value="true">Inverted</option></select>')
                        .val(typeof item.inverted === 'boolean' ? String(item.inverted) : 'inherit').appendTo(logicLabel)
                    const enabled = $('<label>').text('Enabled ').appendTo(row)
                    $('<input type="checkbox" class="led-enabled">').prop('checked', item.enabled !== false).appendTo(enabled)
                    const hidden = $('<label>').text('Hidden (no space in layout) ').appendTo(row)
                    $('<input type="checkbox" class="led-hidden">').prop('checked', item.hidden === true).on('change', updateVisibleCount).appendTo(hidden)
                    field('activeColor', 'Active color (blank = default)', item.activeColor || '')
                    field('passiveColor', 'Inactive color (blank = default)', item.passiveColor || '')
                    field('icon', 'Optional MDI icon, e.g. mdi-alert', item.icon || '')
                }
                updateVisibleCount()
            }
            function updateVisibleCount () {
                const total = $('#bit-led-indicators .led-hidden').length
                const hidden = $('#bit-led-indicators .led-hidden:checked').length
                $('#bit-led-visible-count').text((total - hidden) + ' of ' + total + ' LEDs visible')
            }
            $('#node-input-count').on('change.bitLed', function () { readRows(); renderRows() })
            $('#node-input-inputType').on('change.bitLed', function () {
                const type = $(this).val()
                // Node-RED emits change while initializing the dialog too.
                // Only an actual type change should reset count/source mappings.
                if (type === previousInputType) return
                previousInputType = type
                readRows()
                const suggested = { boolean: 1, uint8: 8, uint16: 16, uint32: 32 }
                if (suggested[type]) $('#node-input-count').val(String(suggested[type]))
                rows.forEach(function (row, i) { row.source = type === 'object' ? 'bit' + i : i })
                renderRows()
            })
            node._bitLedRead = function () { readRows(); return rows.slice(0, Number($('#node-input-count').val())) }
            renderRows()
        },
        oneditsave: function () { this.indicators = this._bitLedRead(); delete this._bitLedRead },
        oneditcancel: function () { delete this._bitLedRead }
    })
})()
</script>
<style>
    #bit-led-indicators { max-height: 430px; overflow-y: auto; }
    .bit-led-editor-row { border: 1px solid #aaa; padding: 8px; margin-bottom: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .bit-led-editor-row label { display: block; width: auto !important; font-size: 12px; }
    .bit-led-editor-row input[type=text], .bit-led-editor-row select { display: block; width: 100%; }
    .bit-led-layout-options { display: inline-grid; grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 12px; width: 70%; }
    #dialog-form .bit-led-layout-options label { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; width: auto !important; min-height: 80px; padding: 12px; border: 1px solid var(--red-ui-form-input-border-color, #aaa); border-radius: 4px; cursor: pointer; }
    #dialog-form .bit-led-layout-options label:has(input:checked) { border: 2px solid var(--red-ui-form-input-border-selected-color, #00897b); }
    .bit-led-layout-options input { position: absolute; right: 4px; top: 4px; width: auto !important; margin: 0; }
    #dialog-form .bit-led-layout-options .bit-led-layout-spread { justify-content: space-between; }
    .bit-led-layout-options b { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: #00c853; flex-shrink: 0; }
</style>
<script type="text/html" data-template-name="ui-bit-led">
    <div class="form-row"><label for="node-input-name">Name</label><input id="node-input-name" type="text"></div>
    <div class="form-row"><label for="node-input-group">Group</label><input id="node-input-group"></div>
    <div class="form-row"><label for="node-input-order">Order</label><input id="node-input-order" type="number" min="0"></div>
    <div class="form-row"><label for="node-input-width">Width</label><input id="node-input-width" type="number" min="0"><span> 0 = group width</span></div>
    <div class="form-row"><label for="node-input-height">Height</label><input id="node-input-height" type="number" min="0"><span> 0 = automatic</span></div>
    <div class="form-row"><label for="node-input-inputType">Input type</label><select id="node-input-inputType"><option value="boolean">Boolean</option><option value="uint8">UInt8</option><option value="uint16">UInt16</option><option value="uint32">UInt32</option><option value="array">Boolean array</option><option value="object">Named object</option></select></div>
    <div class="form-row"><label for="node-input-count">LED count</label><select id="node-input-count"><option>1</option><option>8</option><option>16</option><option>32</option></select></div>
    <div class="form-row"><label for="node-input-layout">LED arrangement</label><select id="node-input-layout"><option value="column">One column</option><option value="grid">Multiple columns</option><option value="row">Horizontal, wrapping</option></select></div>
    <div class="form-row"><label>Label / LED layout</label><input id="node-input-labelLayout" type="hidden">
        <div class="bit-led-layout-options" role="radiogroup" aria-label="Label / LED layout">
            <label><input type="radio" name="bit-led-label-layout" value="label-led" aria-label="Label then LED, together"><span>label</span><b aria-hidden="true"></b></label>
            <label><input type="radio" name="bit-led-label-layout" value="led-label" aria-label="LED then label, together"><b aria-hidden="true"></b><span>label</span></label>
            <label class="bit-led-layout-spread"><input type="radio" name="bit-led-label-layout" value="label-led-spread" aria-label="Label left, LED right"><span>label</span><b aria-hidden="true"></b></label>
            <label class="bit-led-layout-spread"><input type="radio" name="bit-led-label-layout" value="led-label-spread" aria-label="LED left, label right"><b aria-hidden="true"></b><span>label</span></label>
        </div>
    </div>
    <div class="form-row"><label for="node-input-columns">Columns</label><input id="node-input-columns" type="number" min="1" max="32"></div>
    <div class="form-row"><label for="node-input-inverted">Invert default</label><input id="node-input-inverted" type="checkbox" style="width:auto"></div>
    <div class="form-row"><label for="node-input-activeColor">Active color</label><input id="node-input-activeColor" placeholder="#00c853 — green"></div>
    <div class="form-row"><label for="node-input-passiveColor">Inactive color</label><input id="node-input-passiveColor" placeholder="#a8b5ac — green-grey"></div>
    <div class="form-row"><label for="node-input-disabledColor">Disabled color</label><input id="node-input-disabledColor" placeholder="Theme foreground, 12%"></div>
    <div class="form-row"><label for="node-input-diagnostics">Diagnostics</label><input id="node-input-diagnostics" type="checkbox" style="width:auto"></div>
    <p>Colors accept CSS colors and CSS variables. Blank values inherit defaults. Disabled LEDs remain visible; Hidden LEDs are omitted without changing source mappings or input length. Redeploy to apply.</p>
    <p id="bit-led-visible-count" aria-live="polite"></p>
    <div id="bit-led-indicators"></div>
</script>
<script type="text/html" data-help-name="ui-bit-led">
    <p>Displays 1, 8, 16 or 32 status LEDs on FlowFuse Dashboard 2. One input, no outputs.</p>
    <p>Send the explicitly selected type in <code>msg.payload</code>. Unsigned integers must be within their bit width; bit 0 is the least significant bit. Boolean requires one LED. Arrays require exactly the LED count and boolean entries. Named objects require every configured literal key to contain a boolean; extra keys are ignored. Disabled sources are still validated.</p>
    <p>Individual logic and colors override shared defaults. Invalid input retains the last valid display and sets red node status. Warnings are limited to one per five seconds. Refresh/reconnect restores the last valid value while Node-RED is running.</p>
    <p>Label / LED layout places the label before or after the LED, either together or at opposite edges of each indicator cell. LED arrangement controls the grid/column/row separately. Default colors are green (#00c853) for active and green-grey (#a8b5ac) for inactive; custom colors and CSS variables override these.</p>
    <p>Hidden removes an indicator and its label from the layout, including its space. Use an 8-slot input with three hidden indicators to show five LEDs. Sources are not renumbered. Input validation remains unchanged: full array length and all configured object keys are still required. Hidden and Enabled are independent; unhide retains the previous Enabled setting. All indicators may be hidden. Visibility is configured in the editor and applied on redeploy.</p>
    <p>Changing input type resets source mappings; labels and overrides remain. Redeploy after configuration changes. Diagnostics show session totals and average browser rates; rejected payload counts are reported by the runtime warning.</p>
</script>
